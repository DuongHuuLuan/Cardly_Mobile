name: cardly_app
description: "A new Flutter project."
publish_to: "none"

version: 1.5.2+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^9.2.1
  go_router: ^17.2.3
  equatable: ^2.0.7
  retrofit: ^4.4.2
  dio: ^5.7.0
  json_annotation: ^4.12.0
  dartz: ^0.10.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  image: ^4.8.0
  dotenv: ^4.2.0
  flutter_dotenv: ^6.0.1
  dotted_border: ^3.1.0
  path_provider: ^2.1.5
  camera: ^0.12.0+1
  permission_handler: ^12.0.2
  sqflite: ^2.4.2+1
  uuid: ^4.5.3
  avatar_glow: ^3.0.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  json_serializable: ^6.13.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/data/mock/
    - lib/presentation/scan/crop_editor/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_cardly.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_cardly.png"
  adaptive_icon_foreground_inset: 23

flutter_native_splash:
  color: "#FFFFFF"

  image: assets/images/logo_splash.png
  android_12:
    image: assets/images/logo_splash.png
    color: "#FFFFFF"

  android: true
  ios: true
  web: false
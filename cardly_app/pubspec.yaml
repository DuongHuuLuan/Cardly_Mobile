name: cardly_app
description: "A new Flutter project."
publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^9.2.1
  go_router: ^17.2.3
  equatable: ^2.0.7
  retrofit: ^4.4.2
